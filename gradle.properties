# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.109

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=settlemynts
# The human-readable display name for the mod.
mod_name=Settlemynts
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.github.cerealklla.settlemynts

## Required sibling-mod dependency (compile-time only, never bundled/required at runtime)

# Cartographyr's version, used only to locate its built jar in ../Cartographyr/build/libs for the
# compileOnly dependency in build.gradle. Bump this when Cartographyr's own mod_version changes.
# Unlike Lyfe's soft-dependency use of Cartographyr, Settlemynts requires it at runtime too (see
# neoforge.mods.toml) -- settlement founding's distance check has no meaningful fallback without it.
cartographyr_version=0.1.0

## Optional sibling-mod dependency (compile-time only, never bundled/required at runtime)

# Blueprynts' version, used only to locate its built jar in ../Blueprynts/build/libs for the
# compileOnly dependency in build.gradle. Bump this when Blueprynts' own mod_version changes.
# New 2026-09-29: Finalize auto-places a Blueprynts Construction Site block on a newly-valid plot
# (see bridge.BlueprintsConstructionBridge) -- the reverse direction of Blueprynts' own existing
# optional dependency on Settlemynts (bridge.SettlemyntsZoneBridge there).
blueprynts_version=0.1.0

# Protectyons' version, used only to locate its built jar in ../Protectyons/build/libs for the
# compileOnly dependency in build.gradle. Bump this when Protectyons' own mod_version changes.
# New 2026-09-29: Finalize registers a Plot's polygon + permitted players (Mayor, Town Planners,
# Owner) with Protectyons' own permission registry (see bridge.ProtectyonsPlotBridge) -- Cartographyr
# itself has no permission concept, so this is a separate registration from the Cartographyr entity
# already created for the same polygon (design discussion, 2026-09-29).
protectyons_version=0.1.0

# Kyt's version, used only to locate its built jar in ../Kyt/build/libs for the compileOnly
# dependency in build.gradle. Bump this when Kyt's own mod_version changes.
# New 2026-10-01: "Select Kyt" on the Guardhouse's Configure Garrison screen binds a saved Kyt
# loadout name to a GarrisonSlot (see bridge.KytGuardhouseBridge) -- same optional-dependency
# isolation as Blueprynts/Protectyons above, gated behind ModList.get().isLoaded("kyt").
kyt_version=0.1.0

# Yconomics' version, used only to locate its built jar in ../Yconomics/build/libs for the
# compileOnly dependency in build.gradle. Bump this when Yconomics' own mod_version changes.
# New 2026-10-05: a debug command registers a recurring-bill (plot rent) against Yconomics' bill
# engine for a finalized plot (see bridge.YconomicsBillBridge) -- same optional-dependency
# isolation as Blueprynts/Protectyons/Kyt above, gated behind ModList.get().isLoaded("yconomics").
yconomics_version=0.1.0
