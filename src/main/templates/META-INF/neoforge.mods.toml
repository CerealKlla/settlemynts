# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional

# A text field displayed in the mod UI
#credits="" #optional

# The authors of the mod, displayed in the mod UI (optional)
#authors=""

# The description text for the mod (multi line!) (#mandatory)
description='''
Settlement management mod: founding, staking, and finalizing player and
world-generated settlements, plot subdivision/zoning, and (eventually)
taxation/rent, on top of Cartographyr's geographic entity model.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
#[[mixins]]
#config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Cartographyr is a REQUIRED dependency, unlike Lyfe's optional/soft use of it (design doc Section
# 1) -- settlement founding's distance check and the final settlement-polygon handoff both need
# its real API, with no meaningful standalone mode.
[[dependencies.${mod_id}]]
    modId="cartographyr"
    type="required"
    reason="Settlement founding's distance check and settlement-polygon registration both need Cartographyr's geographic entity API."
    ordering="AFTER"
    side="BOTH"

# Optional soft dependency -- the reverse direction of Blueprynts' own existing optional dependency
# on Settlemynts (bridge.SettlemyntsZoneBridge there). Finalizing a plot auto-places a Blueprynts
# Construction Site block if Blueprynts happens to be loaded (see bridge.BlueprintsConstructionBridge);
# the mod works standalone without it. No versionRange -- an empty string is an invalid range that
# makes FML reject an installed Blueprynts outright (same gotcha Blueprynts' own optional
# Settlemynts dependency documents), omitting the field entirely is what actually means "any version."
#
# ordering="NONE", deliberately NOT "AFTER" -- Blueprynts' own optional dependency on Settlemynts
# already declares "AFTER" (blueprynts loads after settlemynts), so this side also declaring "AFTER"
# produced a real, confirmed mod dependency cycle at boot ("Detected a mod dependency cycle:
# blueprynts, settlemynts") -- both mods insisting on loading after the other is unsatisfiable.
# Load order doesn't actually matter here: BlueprintsConstructionBridge only runs during a Finalize
# request (long after both mods' common setup), never at mod-construction/classload time.
[[dependencies.${mod_id}]]
    modId="blueprynts"
    type="optional"
    reason="Auto-places a Construction Site block on a newly-finalized, valid plot if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- Finalize registers a Plot's polygon + permitted players (Mayor, Town
# Planners, Owner) with Protectyons' own permission registry if present (see
# bridge.ProtectyonsPlotBridge); the mod works standalone without it. Same "ordering=NONE, no
# versionRange" reasoning as the blueprynts dependency above.
[[dependencies.${mod_id}]]
    modId="protectyons"
    type="optional"
    reason="Registers a finalized Plot's polygon and permitted players so Protectyons can exempt them from its own protection enforcement."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- "Select Kyt" on the Guardhouse's Configure Garrison screen binds a
# saved Kyt loadout name to a GarrisonSlot if Kyt happens to be loaded (see
# bridge.KytGuardhouseBridge); the mod works standalone without it (the screen's "Select Kyt" row
# simply never appears). Same "ordering=NONE, no versionRange" reasoning as blueprynts/protectyons
# above -- this bridge only ever runs from a player-initiated screen click, long after both mods'
# common setup, so load order doesn't matter.
[[dependencies.${mod_id}]]
    modId="kyt"
    type="optional"
    reason="Binds a saved Kyt loadout name to a Guardhouse garrison slot if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency (2026-10-05) -- a debug command registers a recurring-bill (plot rent)
# against Yconomics' bill engine for a finalized plot if Yconomics happens to be loaded (see
# bridge.YconomicsBillBridge). Same "ordering=NONE, no versionRange" reasoning as the other
# optional dependencies above.
[[dependencies.${mod_id}]]
    modId="yconomics"
    type="optional"
    reason="Lets a finalized plot register a recurring rent bill against Yconomics' bill engine."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency (2026-10-08) -- a Settlement Shop purchase grants the buyer Merchant
# skill XP against Lyfe's skill system if Lyfe happens to be loaded (see
# bridge.LyfeMerchantBridge). Same "ordering=NONE, no versionRange" reasoning as the other optional
# dependencies above.
[[dependencies.${mod_id}]]
    modId="lyfe"
    type="optional"
    reason="Grants the buyer Merchant skill XP when they purchase from a Settlement Shop."
    ordering="NONE"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
